name: Deploy FinValio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify 2026 financial math engine
        run: npm run test:math

      - name: Build static Next.js site
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || 'false' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://muhammedkar07.github.io/finvalio' }}
          NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT_ID || '' }}
          NEXT_PUBLIC_ADSENSE_SLOT_TOP: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_TOP || '' }}
          NEXT_PUBLIC_ADSENSE_SLOT_IN_CONTENT: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_IN_CONTENT || '' }}
          NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR || '' }}
          NEXT_PUBLIC_ADSENSE_SLOT_BOTTOM: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_BOTTOM || '' }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID || '' }}
        run: |
          if [ "$CUSTOM_DOMAIN" = "true" ]; then
            export NEXT_PUBLIC_BASE_PATH=""
          else
            export NEXT_PUBLIC_BASE_PATH="/finvalio"
          fi
          npm run build

      - name: Add .nojekyll for Next.js _next assets
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
